version: 1
seed: 20260911
source:
  sqlite: data/processed/common_pipeline.sqlite
  table: power_operation_fused
outputs:
  sqlite: data/processed/energy_state_discovery.sqlite
  processed: data/processed/energy_state_discovery
  results: results/energy_state_discovery
  compressed_csv: true
segmentation:
  primary: fixed_5s
  fixed:
    durations_seconds: [2, 5, 10]
    overlap_fraction: 0.0
  change_point:
    resample_seconds: 1
    channels: [ActivePowerL1, Flow, Pressure]
    configurations:
      conservative:
        smoothing_bins: 5
        robust_score_threshold: 6.0
        minimum_separation_seconds: 5
      sensitive:
        smoothing_bins: 3
        robust_score_threshold: 4.0
        minimum_separation_seconds: 2
  event_driven:
    transition_fields: [Busy, Done, StationEntryxBG5, ReadyAtStationxBG1, StationExitxBG6]
features:
  required_power_column: ActivePowerL1
  sensor_columns: [Flow, Pressure]
  minimum_samples_for_clustering: 2
scaling:
  group_by: [experiment_id, station_id]
  candidates: [standard, robust]
  selected: standard
  imputation: within_group_median_then_global_median
clustering:
  comparison_sample_max: 20000
  metric_sample_max: 5000
  k_range: [2, 3, 4, 5, 6, 7, 8]
  seeds: [20260911, 20260912, 20260913]
  gmm_covariance_type: diag
  dbscan:
    min_samples: [10, 20]
    eps_quantiles: [0.85, 0.92]
  hdbscan:
    min_cluster_size: [100, 250]
    min_samples: [10, 25]
  selection:
    preferred_family: kmeans
    selected_k: null
    minimum_cluster_fraction: 0.01
    rationale: multi_metric_stability_interpretability
stability:
  bootstrap_repetitions: 5
  bootstrap_fraction: 0.8
  boundary_match_tolerance_seconds: 2
  plc_boundary_comparison_tolerance_seconds: 1
forbidden_steps:
  - QSVC
  - FidelityQuantumKernel
  - VQC
  - QNN
  - quantum_clustering
  - Qiskit_Aer
  - noise_model
  - IBM_hardware
  - QPU
